name: Build Ryujinx ExeFS

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark workspace as a safe Git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install ccache
        run: apt-get update -y && apt-get install -y ccache

      - name: Configure
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake \
            -DCMAKE_CXX_FLAGS="-fpermissive -fPIC" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -Bbuild

      - name: Build Ryujinx package
        run: cmake --build build --target MegaExtension_release_ryujinx --parallel 2

      - name: Check package files
        run: |
          test -d build/MegaExtension_releases/ryujinx
          find build/MegaExtension_releases/ryujinx -type f -print
          test -f build/MegaExtension_releases/ryujinx/mods/contents/0100000011D90000/MegaExtension/exefs/subsdk2

      - name: Upload Ryujinx package
        uses: actions/upload-artifact@v4
        with:
          name: mega_subsdk2_ryujinx_${{ matrix.build_type }}
          path: build/MegaExtension_releases/ryujinx/
          if-no-files-found: error
          retention-days: 14
