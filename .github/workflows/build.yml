name: Build Mega subsdk2 for Ryujinx

on:
  push:
    branches:
      - main
      - feature/mega-evolution
      - feature/coop-server
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends cmake ninja-build
          command -v elf2nso
          command -v npdmtool
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake \
            -DCMAKE_CXX_FLAGS="-fpermissive -fPIC"
      - name: Build subsdk2
        run: cmake --build build --target MegaExtension_Diamond_nso -j 2
      - name: Verify NSO and stage Ryujinx mod
        run: |
          test -s build/MegaExtension_Diamond_out/subsdk2
          python3 scripts/verify_nso.py build/MegaExtension_Diamond_out/subsdk2
          mkdir -p package/MegaExtension/exefs
          cp build/MegaExtension_Diamond_out/subsdk2 package/MegaExtension/exefs/subsdk2
          if test -d romfs-delta; then cp -a romfs-delta package/MegaExtension/romfs; fi
      - name: Upload Ryujinx mod
        uses: actions/upload-artifact@v4
        with:
          name: MegaExtension-Ryujinx
          path: package/MegaExtension/
          if-no-files-found: error
