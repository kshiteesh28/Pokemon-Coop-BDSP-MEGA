name: Co-op server

on:
  push:
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
          go test -race ./...
      - name: Simulate 16 players
        run: |
          go build -o coop-server ./cmd/coop-server
          ./coop-server -listen 127.0.0.1:4100 -data /tmp/coop-data.json &
          sleep 1
          go run ./cmd/coop-sim -players 16 -per-room 4 -duration 10s -config none
      - name: Build apps for Windows, Mac and Linux
        run: |
          set -e
          out=dist
          mkdir -p $out/windows $out/mac-apple $out/mac-intel $out/linux
          flags='-trimpath'
          small='-s -w'
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build $flags -ldflags="-s -w -H=windowsgui" -o "$out/windows/Pokemon Co-op.exe" ./cmd/coop-launcher
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build $flags -ldflags="$small" -o $out/windows/coop-server.exe ./cmd/coop-server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build $flags -ldflags="$small" -o $out/windows/coop-sim.exe ./cmd/coop-sim
          for arch in arm64:mac-apple amd64:mac-intel; do
            a=${arch%%:*}; d=${arch##*:}
            GOOS=darwin GOARCH=$a CGO_ENABLED=0 go build $flags -ldflags="$small" -o "$out/$d/Pokemon Co-op" ./cmd/coop-launcher
            GOOS=darwin GOARCH=$a CGO_ENABLED=0 go build $flags -ldflags="$small" -o $out/$d/coop-server ./cmd/coop-server
            GOOS=darwin GOARCH=$a CGO_ENABLED=0 go build $flags -ldflags="$small" -o $out/$d/coop-sim ./cmd/coop-sim
          done
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build $flags -ldflags="$small" -o $out/linux/coop-server ./cmd/coop-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build $flags -ldflags="$small" -o $out/linux/coop-server-arm64 ./cmd/coop-server
          cp coop.ini.example $out/windows/ && cp coop.ini.example $out/mac-apple/ && cp coop.ini.example $out/mac-intel/
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-coop-windows
          path: server/dist/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-coop-mac-apple-silicon
          path: server/dist/mac-apple/
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-coop-mac-intel
          path: server/dist/mac-intel/
      - uses: actions/upload-artifact@v4
        with:
          name: coop-server-linux
          path: server/dist/linux/
