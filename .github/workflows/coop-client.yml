name: Build co-op client subsdk3 for Ryujinx

on:
  push:
    branches: [main, feature/coop-server]
    paths: ['src/coop/**', 'src/common/**', 'include/**', 'config.cmake.template', 'cmake/**', '.github/workflows/coop-client.yml']
  pull_request:
    paths: ['src/coop/**', 'config.cmake.template', '.github/workflows/coop-client.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake \
            -DCMAKE_CXX_FLAGS="-fpermissive -fPIC"
      - name: Build subsdk3
        run: cmake --build build --target CoopClient_Diamond_nso -j 2
      - name: Verify NSO and stage Ryujinx mod
        run: |
          test -s build/CoopClient_Diamond_out/subsdk3
          python3 scripts/verify_nso.py build/CoopClient_Diamond_out/subsdk3
          mkdir -p package/CoopClient/exefs
          cp build/CoopClient_Diamond_out/subsdk3 package/CoopClient/exefs/subsdk3
      - name: Upload Ryujinx mod
        uses: actions/upload-artifact@v4
        with:
          name: CoopClient-Ryujinx
          path: package/CoopClient/
          if-no-files-found: error
